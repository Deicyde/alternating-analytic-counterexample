name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: lake build (library, challenge, solution, axiom check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

  comparator:
    name: comparator (Challenge.lean vs Solution.lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: leanprover/comparator
          ref: v4.34.0-rc2
          path: comparator
      - uses: actions/checkout@v4
        with:
          repository: Zouuup/landrun
          ref: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          path: landrun
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build landrun
        working-directory: landrun
        run: go build -o landrun cmd/landrun/main.go
      # Install the toolchain and fetch the Mathlib cache, but do NOT build the project:
      # comparator builds Challenge and (sandboxed) Solution itself.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: project
          use-mathlib-cache: true
          build: false
      - name: Build comparator and lean4export
        working-directory: comparator
        run: lake build lean4export comparator
      - name: Run comparator
        working-directory: project
        env:
          COMPARATOR_LANDRUN: ${{ github.workspace }}/landrun/landrun
          COMPARATOR_LEAN4EXPORT: ${{ github.workspace }}/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export
        run: |
          set -o pipefail
          lake env "$GITHUB_WORKSPACE/comparator/.lake/build/bin/comparator" comparator.json 2>&1 | tee comparator.log
          grep -q "Your solution is okay!" comparator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparator-log
          path: project/comparator.log
