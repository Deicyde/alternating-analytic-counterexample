version: "v0.4"

project:
  name: "alternating-analytic-counterexample"
  description: >
    A counterexample, fully formalized in Lean 4 / Mathlib. Main result: assuming that the precomposition map
    f |-> (m |-> m o (f, ..., f)) (Mathlib's ContinuousAlternatingMap.compContinuousLinearMapCLM) is C^omega for all
    normed spaces over all nontrivially normed fields and all finite index types, one derives False. The obstruction:
    over a complete ultrametric field of characteristic 2 with (l^infty/c_0)' = 0 (an explicit such field is
    constructed: the completion of the 2-power Puiseux series over F_2; no hypothesis on the residue field is
    needed), with E = l^infty and F the closed span of the matrices x (x) y + y (x) x, the map on alternating
    2-forms is not analytic at 0. Consequently the C^n smoothness of this map for n : ENat (draft Mathlib PR #43548)
    cannot be extended to n = omega without a hypothesis such as invertibility of (card iota)!, which obstructs an
    analytic vector-bundle structure on bundles of continuous alternating maps in full generality.
  authors: ["Jack McCarthy"]
  responsible_maintainers: ["Jack McCarthy"]
  license: "No license chosen yet (all rights reserved pending the maintainer's decision)"

sources:
  - title: "Precomposition on continuous alternating maps is not analytic in characteristic 2 (paper/COUNTEREXAMPLE.md in this repository)"
    authors: []
    contributors:
      - name: "Claude (Anthropic), working in Claude Code with Jack McCarthy"
        role: "found the counterexample and wrote the informal proof"
    id: "https://github.com/Deicyde/alternating-analytic-counterexample/blob/main/paper/COUNTEREXAMPLE.md"
    type: "original-proof"
    location: "Sections 1, 2', 3, 3', 4, and the 2026-09-19 simplification section"
    relationship: "formalizes"
    note: >
      The theorem is first presented by this formalization. The Lean proof follows the simplified finite identity of
      section 2' (even blocks, swap-invariance argument), not the border form of section 2, and obtains the unit point
      from the hypercube sum of the 2026-09-19 simplification section rather than from Corollary A', so the
      infinite-residue-field hypothesis of section 0 is not used.
    license: ""
    author_endorsement: "participated"
  - title: "Espaces de Banach non archimédiens"
    authors: ["Marius van der Put"]
    id: "Bull. Soc. Math. France 97 (1969), 309-320; http://www.numdam.org/item/BSMF_1969__97__309_0/"
    type: "article"
    location: "Théorème (3.2)"
    relationship: "background"
    note: >
      Background only. The direction needed (a complete non-archimedean field that is not spherically complete
      satisfies (l^infty/c_0)' = 0) is proved from scratch in AltCounter/NestedBalls.lean, in the concrete form
      "nested closed balls with strictly decreasing radii and empty intersection imply NSC".
    license: "proprietary"
    author_endorsement: "n/a"
  - title: "feat(Analysis/Calculus/ContDiff): smoothness reflects along a linear isometry with closed range (Mathlib PR #43548, draft)"
    authors: ["Jack McCarthy"]
    id: "https://github.com/leanprover-community/mathlib4/pull/43548"
    type: "other"
    relationship: "background"
    note: "Proves the C^n statement (n : ENat) whose analytic extension is refuted here; see also the Zulip thread 'bundles of alternating maps' in #mathlib4."
    license: "Apache-2.0"
    author_endorsement: "participated"

