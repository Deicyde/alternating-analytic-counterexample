automation:
  methods:
    - method: "autonomous"
      models: ["claude-fable-5-1", "claude-opus-5"]
      framework: "Claude Code"
      tool_setup: >
        Claude Code (desktop app) with multi-agent workflows. The orchestrating model found the counterexample with the
        help of finite F_2 models, exact solvers (z3) and Python experiments, wrote the informal proof and the complete
        Lean statement skeleton (all statements fixed, compiling with sorry), and then dispatched one subagent per file to
        fill the proofs; files were compiled one at a time against a prebuilt Mathlib. Independent agent passes refereed
        the informal proof and audited the repository (statement faithfulness, proof integrity, documentation).
      cost:
        wall_time: "Counterexample search: several sessions between 2026-09-07 and 2026-09-19; Lean formalization: roughly two hours of wall-clock time with up to ten parallel agents"
        spend_usd: "subscription-based usage"
        hardware: "API-only; Lean compilation on a laptop (Apple M3 Pro, 18 GB)"
      prompting_notes: >
        The human (Jack McCarthy) posed the problem (is the alternating bundle C^omega in positive characteristic?),
        asked for a counterexample, and then asked for the Lean formalization, the repository, and this metadata. No Lean
        code was written or edited by hand.
  spend_usd: "subscription-based usage"
  notes: >
    Everything in this repository (mathematics, Lean code, documentation, this file) was produced by the AI system and
    has not been edited by a human. The Lean development is machine-checked (CI builds it from scratch at the pinned
    Mathlib commit, enforces the axiom list with #guard_msgs, and runs leanprover/comparator on Challenge/Solution).

fidelity:
  divergences: >
    (1) Challenge.lean states the result as "the general C^omega statement implies False"; the general statement is
    quantified over types in universe 0. (2) The write-up names the field "the completion of an algebraic closure of
    F_2((t))" and cites van der Put's theorem; the Lean development instead constructs the completion of the 2-power
    Puiseux series over F_2 (inside Mathlib's Hahn series) and proves the needed
    direction of van der Put's theorem directly. (3) Lean proves non-analyticity at 0 only (enough for the failure of
    ContDiff omega); the write-up's reduction to an arbitrary base point is not formalized. (4) The finite identity is
    formalized in the simplified form of section 2' of the write-up. (5) Sections 0 and 2 of the write-up assume an
    infinite residue field and derive the unit point from a Gauss-norm reduction (Corollary A'); the Lean development
    does not assume it, replacing that step by the hypercube sum over the 0/1 points in characteristic 2 (see the
    dated section "Simplification: the residue-field hypothesis is unnecessary" at the top of the write-up).

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >
    Seven independent adversarial AI referee agents and an adjudicator checked the informal proof (no mathematical error
    found; editorial gaps fixed); three further AI agents audited the Lean statements for faithfulness and vacuity, the
    proofs for integrity, and the documentation for accuracy. No human expert in non-archimedean functional analysis has
    reviewed the write-up yet.

alignment:
  namespace: "AltCounter"
  statements:
    - source: "Theorem (section 0): Q is not analytic"
      lean: "AltCounter.not_analyticAt_Q_of_NSC"
      module: "AltCounter.MainNSC"
      status: "proved"
      note: "at the base point 0"
    - source: "Section 1: analytic and homogeneous of degree 2 implies a bounded bilinear lift"
      lean: "AltCounter.exists_bilinear_of_analyticAt_of_homogeneous"
      module: "AltCounter.Criterion"
      status: "proved"
    - source: "Section 2': determinant of a symmetric zero-diagonal matrix in characteristic 2; odd number of perfect matchings"
      lean: "AltCounter.det_eq_sum_PM_sq, AltCounter.card_PM_odd"
      module: "AltCounter.Pfaffian"
      status: "proved"
    - source: "Section 2': balanced-coefficient lemma and the key coefficient identity"
      lean: "AltCounter.coeff_bal_of_swap_invariant, AltCounter.coeff_bal_prod_matching"
      module: "AltCounter.Balanced"
      status: "proved"
    - source: "Simplification (2026-09-19): hypercube sum over the 0/1 points replaces Corollary A', so no hypothesis on the residue field is needed"
      lean: "AltCounter.sum_eval_cubePt, AltCounter.exists_cubePt_norm_det_ge_one, AltCounter.exists_block_point"
      module: "AltCounter.Hypercube, AltCounter.FiniteLemma"
      status: "proved"
      note: "The Gauss-norm form of Corollary A' (which needed an infinite residue field) is not formalized and is no longer used."
    - source: "Section 3: multilinear Phillips lemma from (l^infty/c_0)' = 0"
      lean: "AltCounter.tail_functional, AltCounter.tail_multilinear, AltCounter.tailProperty_of_NSC, AltCounter.nsc_of_dual"
      module: "AltCounter.PhillipsOne, AltCounter.Phillips, AltCounter.Bridge"
      status: "proved"
    - source: "Section 4: gluing and the determinant contradiction"
      lean: "AltCounter.core_false, AltCounter.norm_det_le_of_close_to_lowrank, AltCounter.one_le_norm_det_add"
      module: "AltCounter.Gluing, AltCounter.DetBounds"
      status: "proved"
    - source: "Existence of a field satisfying the hypotheses (write-up: van der Put, Thm 3.2 and the completed algebraic closure of F_2((t)); Lean: completed 2-power Puiseux series)"
      lean: "AltCounter.exists_goodModel, AltCounter.exists_field_of_goodModel, AltCounter.nsc_of_hasEmptyNestedBalls, AltCounter.exists_field"
      module: "AltCounter.Puiseux, AltCounter.Model, AltCounter.NestedBalls, AltCounter.Final"
      status: "proved"
    - source: "The general C^omega statement is inconsistent"
      lean: "AltCounter.false_of_general_contDiff_omega, AltCounter.false_of_charTwo_banach_contDiff_omega"
      module: "AltCounter.Final"
      status: "proved"
    - source: "Section 1: reduction to an arbitrary base point; section 0: index types with more than two elements, bundle-level corollary"
      lean: ""
      module: ""
      status: "not-formalized"

